[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odx"
version = "0.0.1"
description = "Odoo Developer Semantic Engine — static semantics for real Odoo codebases, surfaced through thin clients (CLI first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maaz" }]
keywords = ["odoo", "static-analysis", "semantic-engine", "cli"]

# Runtime deps stay minimal: the ENGINE core needs only lxml (XML/XPath) and
# jinja2 (generator templates); typer/rich are client-only; mcp is optional.
dependencies = [
    "typer>=0.12",          # CLI client (clients/cli only)
    "rich>=13.0",           # rendering (clients only)
    "jinja2>=3.1",          # generator templates (engine/generators, Phase 2)
    "lxml>=5.0",            # XML parsing + XPath dialect (engine parser / arch builder)
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]          # MCP client (Phase 5): `odx-mcp`
dev = [
    "pytest>=8.0",
    "mcp>=1.2",
]

[project.scripts]
odx = "odx.clients.cli.main:app"
odx-mcp = "odx.clients.mcp.server:main"
odx-lsp = "odx.clients.lsp.server:main"
odx-web = "odx.clients.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["odx"]
# package data (generator templates, the web browser page) ships inside odx/

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --ignore=tests/corpus"
# The Phase 0.5 corpus is real cloned Odoo code with its own (un-runnable-here)
# test files; never collect them.
norecursedirs = ["tests/corpus", "tests/spike/out", "*.egg", ".*", "build", "dist"]

[tool.odx]
# Marker table; real project config lives in .odx.toml written by `odx init`.
